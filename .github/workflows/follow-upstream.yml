name: follow-upstream

# 每天自动跟随 1Panel 官方：面板本体（原生双架构 FPK）+ 应用市场名单（Docker 型 FPK）。
on:
  schedule:
    - cron: '30 18 * * *' # UTC 18:30 = 北京时间次日 02:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync 1Panel panel + appstore list
        run: |
          node scripts/sync-1panel.mjs --repo ${{ github.repository }}
          node scripts/sync.mjs --repo ${{ github.repository }}

      - name: Validate fnpack skeleton
        run: node -e "
          const j=require('./fnpack.json');
          if(j.schema_version!=='2') throw new Error('schema_version must be \"2\"');
          if(!j.source_info?.name||!j.source_info?.author) throw new Error('source_info incomplete');
          if(typeof j.apps!=='object') throw new Error('apps must be object');
          console.log('apps indexed:',Object.keys(j.apps).length);
        "

      - name: Build FPKs for pending apps
        run: |
          chmod +x scripts/build-1panel.sh scripts/build-fpk.sh
          mkdir -p dist
          node -e "console.log(require('./pending.json').map(e=>e.slug).join('\n'))" | while read -r slug; do
            [ -z "$slug" ] && continue
            if [ "$slug" = "1panel" ]; then
              ./scripts/build-1panel.sh dist
            else
              ./scripts/build-fpk.sh "$slug" dist
            fi
          done

      - name: Finalize details + commit + release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HAS_FPK=$(ls dist/*.fpk 2>/dev/null | head -1 || true)
          if [ -n "$HAS_FPK" ]; then
            # Release 名/tag 用「应用名 + 版本」（如 1panel 1.10.34-lts-1）。
            # 版本统一取自 build/<slug>/meta.json，多包时取第一个（当前以 1panel 为主）。
            APP_NAME=$(node -e "const m=require('./build/1panel/meta.json');console.log(m.displayName||'1panel')" 2>/dev/null || echo "app")
            APP_VER=$(node -e "const m=require('./build/1panel/meta.json');console.log(m.version)" 2>/dev/null || echo "update")
            TAG="${APP_NAME}-${APP_VER}"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            node scripts/finalize-1panel.mjs --repo ${{ github.repository }} --tag "$TAG" --dist dist || true
            node scripts/finalize.mjs --repo ${{ github.repository }} --tag "$TAG" --dist dist || true
            git add fnpack.json apps/ assets/ build/ shared/ scripts/ README.md LICENSE
            git commit -m "chore: follow 1Panel $TAG" || true
            git push
            gh release create "$TAG" dist/*.fpk \
              --title "$APP_NAME $APP_VER" \
              --notes "自动跟随 1Panel 官方打包更新：$APP_NAME $APP_VER。由本源 GitHub Actions 生成。"
          else
            git add fnpack.json apps/ build/ shared/ scripts/ README.md pending.json LICENSE || true
            git diff --cached --quiet || { git commit -m "chore: sync from 1Panel"; git push; }
            echo "no new versions, nothing to release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
